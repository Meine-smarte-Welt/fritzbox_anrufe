set_alarm_clock_enabled:
  fields:
    entry_id:
      required: false
      example: "01J..."
      selector:
        text:
    index:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 9
          mode: box
    enabled:
      required: true
      example: true
      selector:
        boolean:

set_alarm_clock:
  fields:
    entry_id:
      required: false
      example: "01J..."
      selector:
        text:
    index:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 9
          mode: box
    time:
      required: false
      example: "06:30"
      selector:
        time:
    weekdays:
      required: false
      example: "mon, tue, wed, thu, fri"
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    name:
      required: false
      example: "Wecker"
      selector:
        text:
    enabled:
      required: false
      example: true
      selector:
        boolean:

set_deflection_enabled:
  fields:
    entry_id:
      required: false
      example: "01J..."
      selector:
        text:
    deflection_id:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 31
          mode: box
    enabled:
      required: true
      example: true
      selector:
        boolean:

