          options: ["to", "from", "all"]
    target:
      required: false
      example: "SIP0"
      selector:
        text:
    from_number:
      required: false
      example: "0123456789"
      selector:
        text:
    dest_type:
      required: true
      example: "number"
      selector:
        select:
          options: ["number", "answering_machine", "phone"]
    dest:
      required: true
      example: "015112345678"
      selector:
        text:
    own_number:
      required: false
